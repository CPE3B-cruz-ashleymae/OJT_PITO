{% extends "blog/base.html" %}
{% load crispy_forms_tags %}
{% load socialaccount %}
{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5">
        <div class="card shadow-sm border-0 rounded-4 p-4 p-md-5 bg-body-tertiary">
            <div class="text-center mb-4">
                <h2 class="fw-bold" style="color: var(--pink-primary);">Sign in</h2>
            </div>

            <form method="POST">
                {% csrf_token %}
                <div class="mb-3">
                    {{ form|crispy }}
                </div>

                <div class="text-end mb-3">
                    <a href="{% url 'password_reset' %}" class="small text-decoration-none" style="color: var(--pink-primary);">Forgot password?</a>
                </div>

                <div class="d-grid gap-2">
                    <button class="btn fw-bold py-2 text-white rounded-3" style="background: var(--pink-gradient); border: none;" type="submit">Sign in</button>
                </div>
            </form>

            <div class="d-flex align-items-center my-4">
                <hr class="flex-grow-1 text-muted opacity-25">
                <span class="mx-3 text-secondary small">or</span>
                <hr class="flex-grow-1 text-muted opacity-25">
            </div>

            <div class="d-grid gap-2">
                <a href="{% provider_login_url 'google' %}" class="btn border py-2 d-flex align-items-center justify-content-center rounded-3 bg-body-tertiary btn-google-hover">
                    <span class="small fw-bold">Sign in with Google</span>
                </a>
            </div>

            <div class="text-center mt-4 pt-2">
                <a href="#" class="small text-decoration-none" style="color: var(--pink-primary);">Sign in with custom SSO</a>
            </div>

            <div class="text-center mt-4">
                <p class="small text-secondary">Don't have an account?
                    <a href="{% url 'register' %}" class="text-decoration-none fw-bold" style="color: var(--pink-primary);">Register here</a>
                </p>
            </div>
        </div>
    </div>
</div>

<style>
    /* These styles now only trigger when data-bs-theme="dark" is active 
       because they are handled by the logic added to base.html */
    .btn-google-hover:hover {
        background-color: var(--search-bg) !important;
    }
</style>
{% endblock content %}
