{% extends "blog/base.html" %}
{% load crispy_forms_tags %}
{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-6">
        <div class="card shadow-sm border-0 rounded-4 p-4 p-md-5 bg-white">
            <h2 class="fw-bold text-center mb-4" style="color: #d81b60;">Set New Password</h2>
            <form method="POST">
                {% csrf_token %}
                <div class="mb-4">
                    {{ form|crispy }}
                </div>
                <div class="d-grid">
                    <button class="btn fw-bold py-2 text-white rounded-3" style="background-color: #d81b60; border: none;" type="submit">
                        Save New Password
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock content %}
