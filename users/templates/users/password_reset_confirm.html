{% extends "blog/base.html" %}
{% load crispy_forms_tags %}
{% block content %}
<style>
    body {
        background: linear-gradient(135deg, #ffb6c1 0%, #ff69b4 50%, #ffb6c1 100%) !important;
        min-height: 100vh;
    }
    .reset-wrapper {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 80vh;
    }
    .reset-card {
        display: flex;
        width: 900px;
        max-width: 100%;
        border-radius: 24px;
        overflow: hidden;
        box-shadow: 0 20px 60px rgba(209, 29, 95, 0.2);
        background: white;
    }
    .reset-illustration {
        flex: 1;
        background: linear-gradient(160deg, #ff85a8 0%, #d11d5f 100%);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 3rem 2rem;
        position: relative;
        overflow: hidden;
    }
    .reset-illustration::before {
        content: '';
        position: absolute;
        width: 300px; height: 300px;
        background: rgba(255,255,255,0.08);
        border-radius: 50%;
        top: -80px; left: -80px;
    }
    .reset-illustration::after {
        content: '';
        position: absolute;
        width: 200px; height: 200px;
        background: rgba(255,255,255,0.08);
        border-radius: 50%;
        bottom: -50px; right: -50px;
    }
    .bubble {
        position: absolute;
        border-radius: 50%;
        background: rgba(255,255,255,0.12);
    }
    .bubble-1 { width: 60px; height: 60px; top: 20%; right: 10%; }
    .bubble-2 { width: 30px; height: 30px; top: 60%; left: 8%; }
    .bubble-3 { width: 45px; height: 45px; bottom: 25%; right: 15%; }
    .illustration-title {
        color: white;
        font-size: 1.8rem;
        font-weight: 800;
        text-align: center;
        margin-top: 1.5rem;
        z-index: 1;
    }
    .illustration-subtitle {
        color: rgba(255,255,255,0.85);
        text-align: center;
        font-size: 0.95rem;
        margin-top: 0.5rem;
        z-index: 1;
    }
    .illustration-svg { width: 100%; max-width: 280px; z-index: 1; }
    .reset-form-panel {
        flex: 1;
        padding: 3rem 2.5rem;
        display: flex;
        flex-direction: column;
        justify-content: center;
        background: white;
    }
    .reset-form-panel h2 {
        font-size: 2rem;
        font-weight: 800;
        color: #2d2d2d;
        margin-bottom: 0.3rem;
    }
    .reset-form-panel .subtitle {
        color: #999;
        font-size: 0.9rem;
        margin-bottom: 2rem;
    }
    .reset-form-panel .form-label {
        font-size: 0.85rem;
        font-weight: 600;
        color: #555;
        margin-bottom: 0.3rem;
    }
    .reset-form-panel .form-control {
        border-radius: 12px;
        border: 1.5px solid #f0c0ce;
        padding: 0.75rem 1rem;
        font-size: 0.95rem;
        transition: border-color 0.2s;
        background-color: #fff8fa;
    }
    .reset-form-panel .form-control:focus {
        border-color: #d11d5f;
        box-shadow: 0 0 0 3px rgba(209, 29, 95, 0.1);
        background-color: #fff;
        outline: none;
    }
    .btn-reset {
        background: linear-gradient(135deg, #ff85a8, #d11d5f);
        color: white !important;
        border: none;
        border-radius: 50px;
        padding: 0.75rem;
        font-weight: 700;
        font-size: 1rem;
        width: 100%;
        transition: all 0.3s ease;
        box-shadow: 0 4px 15px rgba(209, 29, 95, 0.3);
    }
    .btn-reset:hover {
        background: linear-gradient(135deg, #d11d5f, #a0154a);
        box-shadow: 0 6px 20px rgba(209, 29, 95, 0.4);
        transform: translateY(-1px);
    }
    @media (max-width: 768px) {
        .reset-card { flex-direction: column; }
        .reset-illustration { padding: 2rem; min-height: 200px; }
        .illustration-svg { max-width: 160px; }
    }
</style>

<div class="reset-wrapper">
    <div class="reset-card">

        <!-- Left: Illustration Panel -->
        <div class="reset-illustration">
            <div class="bubble bubble-1"></div>
            <div class="bubble bubble-2"></div>
            <div class="bubble bubble-3"></div>

            <svg class="illustration-svg" viewBox="0 0 300 280" xmlns="http://www.w3.org/2000/svg">
                <ellipse cx="150" cy="160" rx="130" ry="110" fill="rgba(255,255,255,0.15)" />
                <!-- Lock body -->
                <rect x="95" y="140" width="110" height="85" rx="12" fill="rgba(255,255,255,0.9)" />
                <!-- Lock shackle -->
                <path d="M120 140 L120 115 Q120 85 150 85 Q180 85 180 115 L180 140"
                    stroke="rgba(255,255,255,0.9)" stroke-width="16" fill="none" stroke-linecap="round"/>
                <!-- Keyhole -->
                <circle cx="150" cy="170" r="14" fill="#ff85a8" />
                <rect x="144" y="172" width="12" height="22" rx="4" fill="#ff85a8" />
                <!-- Stars -->
                <text x="60" y="100" font-size="18" fill="rgba(255,255,255,0.6)">✦</text>
                <text x="220" y="80" font-size="12" fill="rgba(255,255,255,0.5)">✦</text>
                <text x="75" y="200" font-size="10" fill="rgba(255,255,255,0.4)">✦</text>
                <!-- Hearts -->
                <text x="210" y="130" font-size="16" fill="rgba(255,255,255,0.7)">♥</text>
                <text x="65" y="150" font-size="12" fill="rgba(255,255,255,0.5)">♥</text>
            </svg>

            <div class="illustration-title">DevBlog</div>
            <div class="illustration-subtitle">Set your new password</div>
        </div>

        <!-- Right: Form Panel -->
        <div class="reset-form-panel">
            <h2>Set New Password</h2>
            <p class="subtitle">Please enter and confirm your new password below.</p>

            <form method="POST">
                {% csrf_token %}
                <div class="mb-4">
                    {{ form|crispy }}
                </div>
                <button type="submit" class="btn-reset">
                    Save New Password
                </button>
            </form>
        </div>

    </div>
</div>
{% endblock content %}
