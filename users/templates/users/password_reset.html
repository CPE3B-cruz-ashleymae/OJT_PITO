{% extends "blog/base.html" %}
{% load crispy_forms_tags %}
{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-6">
        <!-- This single card container is now correct -->
        <div class="card shadow-sm border-0 rounded-4 p-4 p-md-5 bg-body-tertiary">
            <div class="text-center mb-4">
                <h2 class="fw-bold" style="color: var(--pink-primary);">Forgot Your Password?</h2>
            </div>

            <form method="POST">
                {% csrf_token %}
                <div class="mb-4">
                    {{ form|crispy }}
                </div>
                <div class="d-grid">
                    <button class="btn fw-bold py-2 text-white rounded-3" style="background: var(--pink-gradient); border: none;" type="submit">
                        Send Reset Instructions
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock content %}
