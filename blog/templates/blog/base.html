{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevBlog Premium</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
    
    <style>
        /* Moving Pink Gradient Background */
        .animated-bg {
            position: fixed;
            top: 0; left: 0; 
            width: 100%; height: 100%;
            z-index: -1;
            background: linear-gradient(135deg, #fce4ec, #f8bbd0, #f48fb1);
            background-size: 400% 400%;
            animation: gradientShift 15s ease infinite;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        body { background-color: transparent !important; margin: 0; padding: 0; }
        .content-wrapper { background: rgba(255, 255, 255, 0.9); min-height: 100vh; }
        .navbar { background-color: rgba(255, 255, 255, 0.95) !important; border-bottom: 1px solid #f3e1e4; }
        .nav-link { color: #614e52 !important; font-weight: 500; }
        .theme-toggle-btn { background: none; border: none; color: #614e52; }
    </style>
</head>
<body>
    <div class="animated-bg"></div>
    <div class="content-wrapper">
        <nav class="navbar navbar-expand-lg sticky-top py-3">
            <div class="container">
                <a class="navbar-brand fw-bold" href="{% url 'blog-home' %}">DevBlog</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav ms-auto align-items-center">
                        <li class="nav-item"><a class="nav-link px-3" href="{% url 'blog-home' %}">Feed</a></li>
                        {% if user.is_authenticated %}
                            <li class="nav-item"><a class="nav-link px-3" href="{% url 'post-create' %}">Write</a></li>
                            <li class="nav-item">
                                <form id="logout-form" method="post" action="{% url 'logout' %}" class="d-none">{% csrf_token %}</form>
                                <a class="nav-link px-3" href="#" onclick="document.getElementById('logout-form').submit();">Logout</a>
                            </li>
                        {% else %}
                            <li class="nav-item"><a class="nav-link px-3" href="{% url 'login' %}">Login</a></li>
                        {% endif %}
                        <li class="nav-item"><button class="theme-toggle-btn px-3" id="theme-toggle"><i class="fa-solid fa-moon"></i></button></li>
                    </ul>
                </div>
            </div>
        </nav>
        <div class="admin-content-container">
            {% block content %}{% endblock %}
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
