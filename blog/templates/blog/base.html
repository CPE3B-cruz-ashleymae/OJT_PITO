<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevBlog Premium</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css" rel="stylesheet" />
    
    <script>
        (() => {
            'use strict'
            const getStoredTheme = () => localStorage.getItem('theme')
            const getPreferredTheme = () => {
                const storedTheme = getStoredTheme()
                if (storedTheme) return storedTheme
                return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
            }
            const setTheme = theme => {
                if (theme === 'auto' && window.matchMedia('(prefers-color-scheme: dark)').matches) {
                    document.documentElement.setAttribute('data-bs-theme', 'dark')
                } else {
                    document.documentElement.setAttribute('data-bs-theme', theme)
                }
            }
            setTheme(getPreferredTheme())
        })()
    </script>
    
    <style>
        /* ✨ Professional Soft-Pink Minimalist UI Theme Styles */
        :root {
            --bg-canvas: #fdf7f8;
            --bg-navbar: rgba(255, 255, 255, 0.95);
            --border-color: #f3e1e4;
            --text-main: #3a3a3a;
            --text-muted-link: #614e52;
            --pink-primary: #c2185b;
            --pink-gradient: linear-gradient(135deg, #e91e63, #c2185b);
            --search-bg: #f7eaed;
            --search-focus-bg: #ffffff;
            --btn-outline-hover: #fdf2f4;
        }

        /* 🌙 Dark Mode Custom Palette Mapping overrides */
        [data-bs-theme="dark"] {
            --bg-canvas: #121212;
            --bg-navbar: rgba(30, 30, 30, 0.95);
            --border-color: #2d2426;
            --text-main: #e0e0e0;
            --text-muted-link: #b5a4a7;
            --pink-primary: #f48fb1;
            --pink-gradient: linear-gradient(135deg, #f48fb1, #f06292);
            --search-bg: #251d1e;
            --search-focus-bg: #1a1516;
            --btn-outline-hover: #251619;
        }

        body {
            background-color: var(--bg-canvas);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
            transition: background-color 0.3s ease, color 0.3s ease;
        }
        
        /* Navbar Customization */
        .navbar {
            background-color: var(--bg-navbar) !important;
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border-color);
            box-shadow: 0 4px 20px rgba(216, 27, 96, 0.02);
            transition: background-color 0.3s ease, border-color 0.3s ease;
        }
        
        .navbar-brand {
            color: var(--pink-primary) !important;
            letter-spacing: -0.5px;
            transition: color 0.3s ease;
        }
        
        .nav-link {
            color: var(--text-muted-link) !important;
            font-weight: 500;
            font-size: 0.95rem;
            transition: color 0.2s ease;
        }
        
        .nav-link:hover {
            color: var(--pink-primary) !important;
        }

        /* Welcome Text Styling */
        .welcome-text {
            color: var(--text-main);
            font-weight: 600;
            font-size: 0.95rem;
        }
        
        /* Modernized Search Box */
        .search-container {
            position: relative;
        }
        
        .search-container::before {
            content: "\f002";
            font-family: "Font Awesome 5 Free";
            font-weight: 900;
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: #b59fa3;
            font-size: 0.85rem;
            pointer-events: none;
        }

        .search-bar {
            background-color: var(--search-bg);
            border: 1px solid transparent;
            border-radius: 30px;
            color: var(--text-main);
            padding-left: 40px;
            font-size: 0.9rem;
            height: 40px;
            transition: all 0.25s ease-in-out;
        }
        
        .search-bar:focus {
            background-color: var(--search-focus-bg);
            border-color: var(--pink-primary);
            box-shadow: 0 0 0 4px rgba(194, 24, 91, 0.1);
            color: var(--text-main);
            outline: none;
        }
        
        /* Sleek Button Components */
        .btn-pink {
            background: var(--pink-gradient);
            color: #ffffff !important;
            border: none;
            border-radius: 30px;
            padding: 8px 24px;
            font-size: 0.9rem;
            font-weight: 600;
            letter-spacing: 0.2px;
            box-shadow: 0 4px 12px rgba(194, 24, 91, 0.15);
            transition: all 0.2s ease;
        }
        
        .btn-pink:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(194, 24, 91, 0.25);
        }
        
        .btn-outline-pink {
            background-color: transparent;
            color: var(--pink-primary);
            border: 1px solid var(--pink-primary);
            border-radius: 30px;
            padding: 8px 20px;
            font-size: 0.88rem;
            font-weight: 600;
            transition: all 0.2s ease;
        }
        
        .btn-outline-pink:hover {
            background-color: var(--btn-outline-hover);
            border-color: var(--pink-primary);
            color: var(--pink-primary);
        }

        .card {
            border-radius: 16px;
            border: 1px solid var(--border-color);
            background-color: var(--bg-navbar);
            transition: transform 0.2s ease, box-shadow 0.2s ease, background-color 0.3s ease, border-color 0.3s ease;
        }

        .theme-toggle-btn {
            background: none;
            border: none;
            color: var(--text-muted-link);
            padding: 8px;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background-color 0.2s, color 0.2s;
        }
        .theme-toggle-btn:hover {
            background-color: var(--search-bg);
            color: var(--pink-primary);
        }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg sticky-top mb-5 py-3">
        <div class="progress position-absolute bottom-0 start-0 w-100 rounded-0" style="height: 3px; background: transparent;">
            <div id="reading-progress-indicator" class="progress-bar rounded-0" role="progressbar" style="width: 0%; background: var(--pink-primary); transition: width 0.1s ease-out;"></div>
        </div>

        <div class="container">
            <a class="navbar-brand fw-bold fs-4" href="{% url 'blog-home' %}">DevBlog</a>
            <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <form class="d-flex mx-auto col-lg-5 search-container" method="GET" action="{% url 'blog-home' %}">
                    <input class="form-control search-bar w-100" type="search" name="q" placeholder="Search articles, topics..." value="{{ request.GET.q }}">
                </form>
                <ul class="navbar-nav ms-auto align-items-center gap-2">
                    {% if user.is_authenticated %}
                        <li class="nav-item me-2">
                            <span class="welcome-text px-2"><i class="fa-regular fa-hand-wave text-secondary me-1"></i>Welcome, {{ user.username }}!</span>
                        </li>
                    {% endif %}

                    <li class="nav-item"><a class="nav-link px-3" href="{% url 'blog-home' %}">Feed</a></li>
                    {% if user.is_authenticated %}
                        <li class="nav-item"><a class="nav-link px-3" href="{% url 'post-create' %}">Write</a></li>
                        <li class="nav-item">
                            <form id="logout-form" method="post" action="{% url 'logout' %}" class="d-none">{% csrf_token %}</form>
                            <a class="nav-link px-3 text-muted" href="#" onclick="document.getElementById('logout-form').submit();">Logout</a>
                        </li>
                    {% else %}
                        <li class="nav-item"><a class="nav-link px-3" href="{% url 'login' %}">Login</a></li>
                    {% endif %}
                    
                    <li class="nav-item ms-lg-2">
                        <button class="theme-toggle-btn" id="theme-toggle" type="button" aria-label="Toggle theme">
                            <i id="theme-icon-sun" class="fa-solid fa-sun fs-5 d-none"></i>
                            <i id="theme-icon-moon" class="fa-solid fa-moon fs-5 d-none"></i>
                        </button>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container">
        {% block content %}{% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-core.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/plugins/autoloader/prism-autoloader.min.js"></script>
    
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const toggleBtn = document.getElementById('theme-toggle');
            const sunIcon = document.getElementById('theme-icon-sun');
            const moonIcon = document.getElementById('theme-icon-moon');

            const renderThemeControls = (theme) => {
                if (theme === 'dark') {
                    sunIcon.classList.remove('d-none');
                    moonIcon.classList.add('d-none');
                } else {
                    moonIcon.classList.remove('d-none');
                    sunIcon.classList.add('d-none');
                }
            };

            const currentActiveMode = document.documentElement.getAttribute('data-bs-theme') || 'light';
            renderThemeControls(currentActiveMode);

            toggleBtn.addEventListener('click', () => {
                const activeState = document.documentElement.getAttribute('data-bs-theme');
                const updateTargetMode = activeState === 'dark' ? 'light' : 'dark';
                
                document.documentElement.setAttribute('data-bs-theme', updateTargetMode);
                localStorage.setItem('theme', updateTargetMode);
                renderThemeControls(updateTargetMode);
            });
        });
    </script>

    <script>
        window.addEventListener('scroll', () => {
            const winScroll = document.documentElement.scrollTop || document.body.scrollTop;
            const height = document.documentElement.scrollHeight - document.documentElement.clientHeight;
            const scrolled = height > 0 ? (winScroll / height) * 100 : 0;
            document.getElementById("reading-progress-indicator").style.width = scrolled + "%";
        });
    </script>
</body>
</html>
